<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="shortcut icon"
      href="https://assets.ubuntu.com/v1/e6b1c303-COF%20favicon.ico"
      type="image/x-icon"
    />
    <title>{% block title %}Roadmap{% endblock %}</title>

    <!-- Restore last filter selection when landing on bare "/" -->
    <script>
      (function () {
        if (window.location.pathname === "/" && !window.location.search) {
          var saved = localStorage.getItem("roadmap_last_selection");
          if (saved) {
            window.location.replace("/?" + saved);
          }
        }
      })();
    </script>

    <!-- Vanilla Framework from CDN (newest build published on assets.ubuntu.com) -->
    <link
      rel="stylesheet"
      href="https://assets.ubuntu.com/v1/vanilla-framework-version-4.34.0.min.css"
    />

    <style>
      :root {
        --text: #111;
        --text-muted: #666;
        --text-faint: #999;
        --link: #06c;
        --bg: #fff;
        --bg-sidebar: #f7f7f7;
        --bg-hover: #f5f5f5;
        --bg-input: #f5f5f5;
        --border: #e5e5e5;
        --border-strong: #999;
        --brand: #e95420;

        --status-completed: #0e8420; /* same green as in-progress; the "C" label distinguishes it */
        --status-in-progress: #0e8420; /* Vanilla positive green */
        --status-at-risk: #ff9900;
        --status-missed: #c7162b;
        --status-added: #007aa6; /* original roadmap blue */
        --status-dropped: #111;
        --status-inactive: #fff;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        font-family:
          Ubuntu,
          -apple-system,
          "Segoe UI",
          sans-serif;
        font-size: 16px;
        line-height: 1.4;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button,
      input,
      select {
        font: inherit;
      }

      /* ── layout ─────────────────────────────────────────────────────── */
      .layout {
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr);
        min-height: 100vh;
      }
      .layout-main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      @media (max-width: 768px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>

    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="layout">
      {% block sidebar %}{% endblock %}
      <main class="layout-main">{% block content %}{% endblock %}</main>
    </div>

    {% block scripts %}{% endblock %}

    <script>
      /* ── Sync-status indicator ──────────────────────────────────── */
      (function () {
        function humanDuration(totalSeconds) {
          if (totalSeconds == null) return "—";
          var abs = Math.abs(totalSeconds);
          if (abs < 120) return Math.round(abs) + " min";
          var h = abs / 3600;
          if (h < 48) return h.toFixed(1) + " h";
          return (h / 24).toFixed(1) + " d";
        }

        function refreshSync() {
          fetch("/api/v1/sync/schedule")
            .then(function (r) {
              return r.json();
            })
            .then(function (d) {
              var icon = document.getElementById("sync-icon");
              var label = document.getElementById("sync-label");
              var tip = document.getElementById("sync-tooltip");
              if (!icon) return;

              if (!d.configured || d.last_sync_end == null) {
                icon.className = "sync-icon sync-icon--none";
                label.textContent = "No sync yet";
                tip.textContent = "The scheduler has not completed a sync yet.";
                return;
              }

              // Compute durations client-side from ISO timestamps so the
              // display is always relative to the *browser* clock and immune
              // to server ↔ client clock skew.
              var nowMs = Date.now();
              var sinceSec = d.last_sync_end
                ? Math.round(
                    (nowMs - new Date(d.last_sync_end).getTime()) / 1000,
                  )
                : null;
              var untilSec = d.next_sync_at
                ? Math.round(
                    (new Date(d.next_sync_at).getTime() - nowMs) / 1000,
                  )
                : null;
              var sinceStr = humanDuration(sinceSec);
              var untilStr =
                untilSec != null && untilSec > 0
                  ? humanDuration(untilSec)
                  : "soon";

              if (d.last_sync_ok === false) {
                icon.className = "sync-icon sync-icon--fail";
                label.textContent = "Sync failed";
              } else if (
                sinceSec != null &&
                sinceSec > d.interval_seconds * 2
              ) {
                icon.className = "sync-icon sync-icon--stale";
                label.textContent = sinceStr + " ago";
              } else {
                icon.className = "sync-icon sync-icon--ok";
                label.textContent = sinceStr + " ago";
              }

              var lines = [];
              lines.push("Last sync: " + sinceStr + " ago");
              lines.push("Next sync: " + untilStr);
              lines.push("Interval: " + humanDuration(d.interval_seconds));
              if (d.last_sync_end) {
                lines.push(
                  "Finished: " + new Date(d.last_sync_end).toLocaleString(),
                );
              }
              if (d.error_message) {
                lines.push("Error: " + d.error_message);
              }
              tip.textContent = lines.join("\n");
              tip.style.whiteSpace = "pre";
            })
            .catch(function () {
              if (!document.getElementById("sync-icon")) return;
              document.getElementById("sync-icon").className =
                "sync-icon sync-icon--none";
              document.getElementById("sync-label").textContent = "—";
            });
        }

        refreshSync();
        // Refresh every 60 s so the "ago" label stays current
        setInterval(refreshSync, 60000);
      })();
    </script>
  </body>
</html>
